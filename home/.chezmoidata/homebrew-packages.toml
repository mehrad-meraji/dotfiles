# Packages are split by machine role. `machineRole` is set at `chezmoi init`
# (see .chezmoi.toml.tmpl) and picks which of laptop/server is merged on top
# of shared.

[homebrew]
taps = []

# ---------------------------------------------------------------- shared ----
# Installed everywhere. Keep this list boring: shell, editor, core CLI.
[homebrew.shared]
brews = [
  "age",
  "bat",
  "chezmoi",
  "direnv",
  "eza",
  "fd",
  "fish",
  "fzf",
  "gh",
  "git",
  "gnupg",
  "htop",
  "jq",
  "neovim",
  "ripgrep",
  "starship",
  "tmux",
  "watch",
  "zoxide",
  "zsh",
]
casks = [
  "font-jetbrains-mono-nerd-font",
]

# ---------------------------------------------------------------- laptop ----
[homebrew.laptop]
brews = [
  "ansible",
  "bat-extras",
  "bitwarden-cli",
  "composer",
  "create-dmg",
  "doctl",
  "exiftool",
  "ffmpeg",
  "fswatch",
  "git-filter-repo",
  "gitleaks",
  "go",
  "lazygit",
  "libpq",
  "mise",
  "nx",
  "opencode",
  "opentofu",
  "p7zip",
  "php@8.4",
  "pinentry-mac",
  "pipx",
  "pnpm",
  "python@3.11",
  "qpdf",
  "railway",
  "rbw",
  "rclone",
  "rustup",
  "xcodegen",
  "yt-dlp",
  "zellij",
]
casks = [
  "antigravity",
  "appcleaner",
  "bitwarden",
  "blender",
  "claude",
  "cursor",
  "discord",
  "duckduckgo",
  "figma",
  "git-credential-manager",
  "google-chrome",
  "herd",
  "karabiner-elements",
  "lm-studio",
  "logi-options+",
  "obsidian",
  "ollama-app",
  "raycast",
  "rustdesk",
  "sf-symbols",
  "signal",
  "sketch",
  "slack",
  "stats",
  "syncthing-app",
  "tailscale-app",
  "vlc",
  "webpquicklook",
  "zed",
  "zoom",
]

# ---------------------------------------------------------------- server ----
[homebrew.server]
brews = [
  "cloudflared",
  "colima",
  "docker",
  "docker-compose",
  # rbw backs `hasVault`, which renders /etc/sentinel.conf. pinentry-mac is
  # needed with it: the TTY pinentries fail with "Inappropriate ioctl for
  # device" when apply runs outside a terminal, so unlocking never succeeds.
  "pinentry-mac",
  "rbw",
  "restic",
  # Notes hub: bridges the iCloud Obsidian vault to Syncthing peers (work Macs,
  # non-Apple devices). Runs as a brew service; see 55_syncthing.
  "syncthing",
  "tailscale",
]
# Obsidian is never opened on the server. Installed so iCloud Drive treats its
# container (iCloud~md~obsidian) as in use on this Mac and keeps it synced.
casks = [
  "obsidian",
]
