# Packages are split by machine role. `machineRole` is set at `chezmoi init`
# (see .chezmoi.toml.tmpl) and picks which of laptop/server is merged on top
# of shared.

[homebrew]
taps = []

# ---------------------------------------------------------------- shared ----
# Installed everywhere. Keep this list boring: shell, editor, core CLI.
[homebrew.shared]
brews = [
  "age",
  "bat",
  "chezmoi",
  "direnv",
  "eza",
  "fd",
  "fish",
  "fzf",
  "gh",
  "git",
  "gnupg",
  "htop",
  "jq",
  "neovim",
  "ripgrep",
  "starship",
  "tmux",
  "watch",
  "zoxide",
  "zsh",
]
casks = [
  "font-jetbrains-mono-nerd-font",
  "orbstack",
]

# ---------------------------------------------------------------- laptop ----
[homebrew.laptop]
brews = [
  "ansible",
  "bat-extras",
  "bitwarden-cli",
  "composer",
  "doctl",
  "ffmpeg",
  "gitleaks",
  "lazygit",
  "libpq",
  "mise",
  "nx",
  "opencode",
  "opentofu",
  "php@8.4",
  "pinentry-mac",
  "pipx",
  "pnpm",
  "python@3.11",
  "railway",
  "rbw",
  "rclone",
  "rustup",
  "yt-dlp",
]
casks = [
  "alacritty",
  "antigravity",
  "appcleaner",
  "bitwarden",
  "blender",
  "claude",
  "cursor",
  "discord",
  "duckduckgo",
  "figma",
  "git-credential-manager",
  "google-chrome",
  "herd",
  "karabiner-elements",
  "lm-studio",
  "logi-options+",
  "obsidian",
  "ollama-app",
  "raycast",
  "rustdesk",
  "sf-symbols",
  "signal",
  "sketch",
  "slack",
  "stats",
  "syncthing",
  "tailscale-app",
  "vlc",
  "webpquicklook",
  "zed",
  "zen-browser",
  "zoom",
]

# ---------------------------------------------------------------- server ----
[homebrew.server]
brews = [
  "cloudflared",
  "restic",
  "tailscale",
]
casks = []
